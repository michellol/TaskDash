<!--
  FIREBASE SETUP (one-time, ~5 minutes):
  1. Go to https://console.firebase.google.com, create a free project.
  2. In the project, click "Add app" > Web (</>), register it (no hosting needed).
  3. Copy the firebaseConfig object it gives you into FIREBASE_CONFIG below.
  4. In the left nav, go to Build > Realtime Database > Create Database (any region, start in "test mode" is fine to begin).
  5. Go to the Rules tab of the Realtime Database and set:
       {
         "rules": {
           ".read": true,
           ".write": true
         }
       }
     This is what makes "no passwords, just a word" possible: anyone with the
     board name can read/write that board. It also means anyone who finds your
     database URL could technically read every board on it, so don't put
     anything truly sensitive in here. Good enough for team task boards.
  6. Save this file, push it to a GitHub repo, enable GitHub Pages on it. Done.
-->

<style>
  :root{
    --board-bg-1:#1c2b30;
    --board-bg-2:#131e22;
    --ink:#f4f1e8;
    --ink-dim:#a9bcc0;
    --accent:#d9a544;
    --accent-dark:#b9862f;
    --card-bg:#fffdf8;
    --card-border:rgba(0,0,0,0.08);
    --danger:#c65a4e;
    --good:#4f9b6e;
    --radius-card:18px;
    --radius-field:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }

  *{box-sizing:border-box;}
  body{margin:0;}
  html, body{height:100%;}

  .app{
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(217,165,68,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(217,165,68,0.06), transparent 45%),
      linear-gradient(160deg, var(--board-bg-1), var(--board-bg-2));
    font-family:var(--font-body);
    color:var(--ink);
  }

  header.top{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    padding:28px 28px 0;
  }

  .board-wrap{
    flex:1 1 auto;
    overflow-y:auto;
    padding:20px 28px;
  }

  .title-block h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .header-icon{
    height:34px;
    width:auto;
    display:block;
  }

  .title-block p{
    margin:0;
    color:var(--ink-dim);
    font-size:14px;
  }

  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  button{
    font-family:var(--font-body);
    cursor:pointer;
    border:none;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .btn:active{transform:scale(0.96);}

  .btn-primary{
    background:#0F766E;
    color:#f4faf9;
    box-shadow:0 4px 14px rgba(15,118,110,0.35);
  }

  .btn-primary:hover{background:#0b5c56;}

  .btn-ghost{
    background:rgba(244,241,232,0.08);
    color:var(--ink);
    border:1px solid rgba(244,241,232,0.18);
  }

  .btn-ghost:hover{background:rgba(244,241,232,0.15);}

  .archive-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 5px;
    border-radius:999px;
    background:var(--danger);
    color:#fff;
    font-size:11px;
    font-weight:700;
    margin-left:2px;
  }

  #board{
    display:grid;
    grid-template-columns:repeat(auto-fill, 280px);
    gap:20px;
    align-items:start;
  }

  .card{
    background:var(--card-bg);
    border-radius:var(--radius-card);
    border:1px solid var(--card-border);
    box-shadow:0 10px 30px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.12);
    color:#2a2a26;
    overflow:hidden;
    position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
    cursor:grab;
  }

  .card:active{cursor:grabbing;}
  .card.sortable-ghost{opacity:0.35;}
  .card.sortable-chosen{
    box-shadow:0 16px 40px rgba(0,0,0,0.35);
    transform:scale(1.02) rotate(-0.5deg);
  }

  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    padding:14px 14px 10px;
  }

  .card-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    line-height:1.3;
    outline:none;
    flex:1;
    min-width:0;
    word-break:break-word;
  }

  .card-title:focus{
    box-shadow:0 0 0 2px var(--accent);
    border-radius:4px;
  }

  .card-title:empty:before{
    content:"Untitled assignment";
    color:#b0aca0;
  }

  .del-btn{
    background:transparent;
    color:#b0aca0;
    font-size:16px;
    line-height:1;
    padding:4px 6px;
    border-radius:6px;
    flex-shrink:0;
    font-weight:600;
  }

  .del-btn:hover{background:#f3e2df;color:var(--danger);}
  .del-btn.confirm{background:var(--danger);color:#fff;font-size:10px;padding:4px 8px;font-weight:700;}

  .card-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:0 10px 10px;
    align-items:start;
  }

  .col-left, .col-right{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }

  .card-foot{
    padding:2px 14px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .card-foot .last-logged{padding:0;margin:0;}
  .card-foot .complete-btn{margin-left:auto;}
  .col-left{gap:6px;}

  .star-tally{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(231,198,90,0.5);
    border:1px solid rgba(43,33,19,0.25);
    color:#2B2113;
    padding:10px 16px;
