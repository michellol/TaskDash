<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIT EM Task Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --board-bg-1:#1c2b30;
    --board-bg-2:#131e22;
    --ink:#f4f1e8;
    --ink-dim:#a9bcc0;
    --accent:#d9a544;
    --accent-dark:#b9862f;
    --card-bg:#fffdf8;
    --card-border:rgba(0,0,0,0.08);
    --danger:#c65a4e;
    --good:#4f9b6e;
    --radius-card:18px;
    --radius-field:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html, body{height:100%;}
  .app{
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(217,165,68,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(217,165,68,0.06), transparent 45%),
      linear-gradient(160deg, var(--board-bg-1), var(--board-bg-2));
    font-family:var(--font-body);
    color:var(--ink);
  }
  header.top{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    padding:28px 28px 0;
  }
  .board-wrap{
    flex:1 1 auto;
    overflow-y:auto;
    padding:20px 28px;
  }
  .title-block h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .header-icon{
    height:34px;
    width:auto;
    display:block;
  }
  .title-block p{
    margin:0;
    color:var(--ink-dim);
    font-size:14px;
  }
  .actions{display:flex;gap:10px;align-items:center;}
  button{
    font-family:var(--font-body);
    cursor:pointer;
    border:none;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{
    background:#0F766E;
    color:#f4faf9;
    box-shadow:0 4px 14px rgba(15,118,110,0.35);
  }
  .btn-primary:hover{background:#0b5c56;}
  .btn-ghost{
    background:rgba(244,241,232,0.08);
    color:var(--ink);
    border:1px solid rgba(244,241,232,0.18);
  }
  .btn-ghost:hover{background:rgba(244,241,232,0.15);}
  .archive-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 5px;
    border-radius:999px;
    background:var(--danger);
    color:#fff;
    font-size:11px;
    font-weight:700;
    margin-left:2px;
  }

  #board{
    display:grid;
    grid-template-columns:repeat(auto-fill, 280px);
    gap:20px;
    align-items:start;
  }

  .card{
    background:var(--card-bg);
    border-radius:var(--radius-card);
    border:1px solid var(--card-border);
    box-shadow:0 10px 30px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.12);
    color:#2a2a26;
    overflow:hidden;
    position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
    cursor:grab;
  }
  .card:active{cursor:grabbing;}
  .card.sortable-ghost{
    opacity:0.35;
  }
  .card.sortable-chosen{
    box-shadow:0 16px 40px rgba(0,0,0,0.35);
    transform:scale(1.02) rotate(-0.5deg);
  }
  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    padding:14px 14px 10px;
  }
  .card-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    line-height:1.3;
    outline:none;
    flex:1;
    min-width:0;
    word-break:break-word;
  }
  .card-title:focus{
    box-shadow:0 0 0 2px var(--accent);
    border-radius:4px;
  }
  .card-title:empty:before{
    content:"Untitled assignment";
    color:#b0aca0;
  }
  .del-btn{
    background:transparent;
    color:#b0aca0;
    font-size:16px;
    line-height:1;
    padding:4px 6px;
    border-radius:6px;
    flex-shrink:0;
    font-weight:600;
  }
  .del-btn:hover{background:#f3e2df;color:var(--danger);}
  .del-btn.confirm{background:var(--danger);color:#fff;font-size:10px;padding:4px 8px;font-weight:700;}

  .card-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:0 10px 10px;
    align-items:start;
  }
  .col-left, .col-right{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }
  .card-foot{
    padding:2px 14px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .card-foot .last-logged{padding:0;margin:0;}
  .card-foot .complete-btn{margin-left:auto;}
  .col-left{gap:6px;}

  .star-tally{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(231,198,90,0.5);
    border:1px solid rgba(43,33,19,0.25);
    color:#2B2113;
    padding:10px 16px;
    border-radius:999px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
  }
  .star-tally .star-icon{flex-shrink:0;display:inline-block;font-size:16px;line-height:1;}
  .star-tally .star-icon.wiggle{animation:starWiggleSpin 1.3s ease;}
  @keyframes starWiggleSpin{
    0%{transform:rotate(0deg);}
    8%{transform:rotate(-16deg);}
    18%{transform:rotate(13deg);}
    28%{transform:rotate(-9deg);}
    38%{transform:rotate(6deg);}
    48%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  .star-tally.bump{animation:starBump .5s ease;}
  @keyframes starBump{
    0%{transform:scale(1);}
    35%{transform:scale(1.22) rotate(-6deg);}
    70%{transform:scale(0.96) rotate(3deg);}
    100%{transform:scale(1) rotate(0);}
  }

  .section-divider{
    flex:0 0 auto;
    height:9px;
    border:none;
    border-radius:5px;
    margin:0 28px;
    background:linear-gradient(90deg, rgba(15,118,110,0), rgba(15,118,110,0.55) 15%, rgba(15,118,110,0.55) 85%, rgba(15,118,110,0));
  }
  .color-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }
  .card-color-btn{
    width:15px;height:15px;
    flex-shrink:0;
  }
  .title-wrap{
    display:flex;
    align-items:center;
    gap:2px;
    flex:1;
    min-width:0;
  }
  .ongoing-badge{
    display:inline-block;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--accent);
    color:#241a06;
    padding:2px 7px;
    border-radius:999px;
    margin-left:2px;
    flex-shrink:0;
  }
  .ongoing-toggle{
    background:transparent;
    color:#b0aca0;
    font-size:14px;
    padding:4px 6px;
    border-radius:6px;
    flex-shrink:0;
  }
  .ongoing-toggle:hover{background:#f0ede4;color:var(--accent-dark);}
  .ongoing-toggle.active{color:var(--accent-dark);background:#fdf1da;}
  .last-logged{
    font-size:11px;
    color:#9a9585;
    padding:0 14px 12px;
    font-family:var(--font-mono);
    margin-top:-2px;
  }
  .field{
    border-radius:var(--radius-field);
    padding:9px 10px 10px;
    position:relative;
    min-height:74px;
    transition:background .2s ease;
  }
  .field-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:700;
    opacity:0.55;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }
  .field-text{
    font-size:13px;
    line-height:1.35;
    outline:none;
    min-height:32px;
    font-family:var(--font-body);
  }
  .field-text.is-date{font-family:var(--font-mono);font-size:12.5px;}
  .field-text:empty:before{
    content:"—";
    opacity:0.35;
  }
  .field-text:focus{
    box-shadow:0 0 0 2px rgba(0,0,0,0.15);
    border-radius:4px;
  }
  .swatch-btn{
    width:13px;height:13px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,0.2);
    background:#fff;
    flex-shrink:0;
    padding:0;
  }
  .swatch-pop{
    position:fixed;
    z-index:200;
    background:#2a2a26;
    border-radius:10px;
    padding:7px;
    display:none;
    gap:5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .swatch-pop.open{display:flex;}
  .swatch-opt{
    width:18px;height:18px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.5);
    padding:0;
  }
  .swatch-opt:hover{transform:scale(1.15);}

  .complete-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;
    border:1.5px solid #c9c4b4;
    color:#6b6656;
    padding:7px 14px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    transition:all .15s ease;
  }
  .complete-btn:hover{border-color:var(--good);color:var(--good);background:#eef7f1;}

  /* stamp animation */
  .stamp{
    position:absolute;
    inset:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    opacity:0;
    z-index:30;
  }
  .card.stamping .stamp{
    animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .stamp-mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    letter-spacing:0.08em;
    color:var(--good);
    border:4px solid var(--good);
    border-radius:10px;
    padding:6px 18px;
    transform:rotate(-8deg);
    background:rgba(255,255,255,0.9);
  }
  @keyframes stampIn{
    0%{opacity:0;transform:scale(2.4) rotate(-8deg);}
    55%{opacity:1;transform:scale(0.92) rotate(-8deg);}
    75%{opacity:1;transform:scale(1.05) rotate(-8deg);}
    100%{opacity:1;transform:scale(1) rotate(-8deg);}
  }
  .card.flying{
    animation:flyOut .5s ease forwards;
  }
  @keyframes flyOut{
    0%{opacity:1;transform:scale(1) translateY(0);}
    100%{opacity:0;transform:scale(0.5) translateY(-40px);}
  }

  /* empty state */
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-dim);
  }
  .empty-state h3{font-family:var(--font-display);color:var(--ink);margin-bottom:6px;}
  .add-tile{
    border:2px dashed rgba(244,241,232,0.25);
    border-radius:var(--radius-card);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:180px;
    color:var(--ink-dim);
    font-weight:600;
    font-size:14px;
    transition:all .15s ease;
    background:transparent;
    width:100%;
  }
  .add-tile:hover{border-color:var(--accent);color:var(--accent);background:rgba(217,165,68,0.06);}

  /* archive drawer */
  .archive-overlay{
    position:fixed;inset:0;
    background:rgba(10,14,16,0.72);
    backdrop-filter:blur(3px);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:100;
    padding:40px 20px;
    overflow-y:auto;
  }
  .archive-overlay.open{display:flex;}
  .archive-panel{
    background:var(--card-bg);
    color:#2a2a26;
    border-radius:20px;
    width:100%;
    max-width:640px;
    padding:24px 24px 30px;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
  }
  .archive-panel h2{
    font-family:var(--font-display);
    margin:0 0 4px;
    font-size:20px;
  }
  .archive-panel .sub{color:#8a8578;font-size:13px;margin-bottom:18px;}
  .archive-close{
    float:right;
    background:transparent;
    font-size:20px;
    color:#8a8578;
    line-height:1;
    padding:4px 8px;
    border-radius:8px;
  }
  .archive-close:hover{background:#f0ede4;}
  .archive-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid #ece8dc;
  }
  .archive-item:last-child{border-bottom:none;}
  .archive-item-title{font-weight:600;font-size:14px;}
  .archive-item-date{font-family:var(--font-mono);font-size:11.5px;color:#8a8578;margin-top:2px;}
  .archive-actions{display:flex;gap:8px;flex-shrink:0;}
  .mini-btn{
    background:#f0ede4;
    color:#5a5648;
    font-size:12px;
    font-weight:600;
    padding:6px 11px;
    border-radius:8px;
  }
  .mini-btn:hover{background:#e4e0d2;}
  .mini-btn.danger:hover{background:#f3e2df;color:var(--danger);}
  .archive-empty{color:#8a8578;font-size:14px;padding:20px 4px;}

  .events-section{
    margin-top:40px;
  }
  .events-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .events-header h2{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:700;
    margin:0;
  }
  .events-table-wrap{
    background:#E7C65A;
    border-radius:16px;
    overflow-x:auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.12);
  }
  table.events-table{
    width:100%;
    border-collapse:collapse;
    color:#2B2113;
    min-width:640px;
  }
  .events-table th{
    background:rgba(43,33,19,0.08);
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:0.05em;
    font-weight:700;
    color:#2B2113;
    text-align:left;
    padding:11px 14px;
    white-space:nowrap;
  }
  .events-table td{
    padding:10px 14px;
    border-top:1px solid rgba(43,33,19,0.15);
    font-size:13.5px;
    vertical-align:top;
  }
  .events-table td[contenteditable]{
    outline:none;
    min-width:70px;
  }
  .events-table td[contenteditable]:empty:before{
    content:"—";
    opacity:0.3;
  }
  .events-table td[contenteditable]:focus{
    box-shadow:inset 0 0 0 2px var(--accent);
    border-radius:4px;
  }
  .events-table td.date-cell{white-space:nowrap;}
  .event-del-cell{
    width:60px;
    text-align:center;
    padding:10px 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .event-del-btn{
    background:transparent;
    color:#c2beb0;
    font-size:15px;
    padding:4px 7px;
    border-radius:6px;
  }
  .event-del-btn:hover{background:#f3e2df;color:var(--danger);}
  .events-empty td{
    text-align:center;
    color:rgba(43,33,19,0.55);
    padding:22px 14px;
    font-style:italic;
  }
  .add-row-btn{
    margin-top:12px;
  }

  @media (max-width:520px){
    .app{padding:18px 14px 60px;}
    #board{grid-template-columns:1fr;}
    .fields{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
const STORAGE_KEY = 'rick-board-data';
const PALETTE = ['#ffffff','#ffe8a3','#ffc9a8','#b9e4c9','#afd4f2','#d9c2f0','#f5b8c4'];
const FIELDS = [
  {key:'doneLooksLike', label:'What done looks like'},
  {key:'notes', label:'Notes'},
  {key:'dueDate', label:'Due date'},
  {key:'checkIn', label:'Mid-point check-in'},
  {key:'blockedOn', label:"What's blocked on this"},
];
function fieldDef(key){ return FIELDS.find(f => f.key === key); }

let state = { assignments: [], archive: [], starTotal: 0, events: [] };

function uid(){ return 'a' + Math.random().toString(36).slice(2,10); }

function blankFields(){
  const f = {};
  FIELDS.forEach(fd => f[fd.key] = { text:'', color:'#ffffff' });
  return f;
}

function sampleData(){
  return {
    assignments:[
      {
        id: uid(), title:'AED Battery Pack Deployment', ongoing:false, cardColor:'#fffdf8',
        fields:{
          doneLooksLike:{text:'All battery packs deployed to highest priority locations, airtable updated, team notified of completed deployment', color:'#b9e4c9'},
          notes:{text:'', color:'#ffffff'},
          dueDate:{text:'Sept 3', color:'#ffe8a3'},
          checkIn:{text:'August 18; weekly update in 1:1s', color:'#afd4f2'},
          blockedOn:{text:'', color:'#ffffff'},
        }
      },
      {
        id: uid(), title:'Draft SOP Language', ongoing:false, cardColor:'#fffdf8',
        fields:{
          doneLooksLike:{text:'Write draft defining advisory vs alert', color:'#d9c2f0'},
          notes:{text:'', color:'#ffffff'},
          dueDate:{text:'July 28', color:'#ffe8a3'},
          checkIn:{text:'', color:'#afd4f2'},
          blockedOn:{text:'', color:'#ffffff'},
        }
      },
      {
        id: uid(), title:'Rave template fix', ongoing:false, cardColor:'#fffdf8',
        fields:{
          doneLooksLike:{text:'Pared down list of templates; all fully functional', color:'#d9c2f0'},
          notes:{text:'', color:'#ffffff'},
          dueDate:{text:'August 4', color:'#ffe8a3'},
          checkIn:{text:'July 28', color:'#afd4f2'},
          blockedOn:{text:'', color:'#f5b8c4'},
        }
      },
    ],
    archive: [],
    starTotal: 0,
    events: [
      { id: uid(), date:'Aug 5', event:'EMS Advisory Board Meeting', location:'Station 3 conference room', notes:'Bring updated SOP draft', color:'#ffe8a3' },
      { id: uid(), date:'Aug 20', event:'Regional Training Day', location:'County Fairgrounds', notes:'', color:'#afd4f2' },
    ]
  };
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      state = JSON.parse(res.value);
      if(typeof state.starTotal !== 'number'){
        state.starTotal = (state.archive || []).length;
      }
      if(!Array.isArray(state.events)){
        state.events = [];
      }
    } else {
      state = sampleData();
      await save();
    }
  } catch(e){
    state = sampleData();
    await save();
  }
  render();
}

async function save(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
  } catch(e){
    console.error('Storage error', e);
  }
}

function closeAllSwatchPops(){
  document.querySelectorAll('.swatch-pop.open').forEach(p => p.classList.remove('open'));
}

function openPopover(btn, pop){
  closeAllSwatchPops();
  const rect = btn.getBoundingClientRect();
  pop.style.left = rect.left + 'px';
  pop.style.top = (rect.bottom + 6) + 'px';
  pop.classList.add('open');
  requestAnimationFrame(() => {
    const popRect = pop.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if(popRect.right > window.innerWidth - 8){
      left = Math.max(8, window.innerWidth - popRect.width - 8);
    }
    if(popRect.bottom > window.innerHeight - 8){
      top = rect.top - popRect.height - 6;
    }
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  });
}

function fieldBlock(assignment, fieldDef){
  if(!assignment.fields[fieldDef.key]){
    assignment.fields[fieldDef.key] = { text:'', color:'#ffffff' };
  }
  const data = assignment.fields[fieldDef.key];
  const field = document.createElement('div');
  field.className = 'field';
  field.style.background = data.color;

  const label = document.createElement('div');
  label.className = 'field-label';

  const labelText = document.createElement('span');
  labelText.textContent = fieldDef.label;
  label.appendChild(labelText);

  const swatchBtn = document.createElement('button');
  swatchBtn.className = 'swatch-btn';
  swatchBtn.style.background = data.color;
  swatchBtn.title = 'Change color';
  label.appendChild(swatchBtn);

  const pop = document.createElement('div');
  pop.className = 'swatch-pop';
  PALETTE.forEach(c => {
    const opt = document.createElement('button');
    opt.className = 'swatch-opt';
    opt.style.background = c;
    opt.addEventListener('click', async (e) => {
      e.stopPropagation();
      data.color = c;
      field.style.background = c;
      swatchBtn.style.background = c;
      pop.classList.remove('open');
      await save();
    });
    pop.appendChild(opt);
  });
  swatchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = pop.classList.contains('open');
    if(!wasOpen) openPopover(swatchBtn, pop); else closeAllSwatchPops();
  });

  const text = document.createElement('div');
  text.className = 'field-text';
  text.contentEditable = 'true';
  text.textContent = data.text;
  text.addEventListener('blur', async () => {
    data.text = text.textContent.trim();
    await save();
  });
  text.addEventListener('mousedown', (e) => e.stopPropagation());
  text.addEventListener('dragstart', (e) => e.stopPropagation());

  field.appendChild(label);
  field.appendChild(pop);
  field.appendChild(text);
  return field;
}

function cardEl(assignment){
  const card = document.createElement('div');
  card.className = 'card' + (assignment.ongoing ? ' is-ongoing' : '');
  card.dataset.id = assignment.id;
  card.setAttribute('draggable', 'false'); // Sortable handles this
  if(!assignment.cardColor) assignment.cardColor = '#fffdf8';
  card.style.background = assignment.cardColor;

  const stamp = document.createElement('div');
  stamp.className = 'stamp';
  stamp.innerHTML = '<div class="stamp-mark"></div>';
  card.appendChild(stamp);

  const head = document.createElement('div');
  head.className = 'card-head';

  const titleWrap = document.createElement('div');
  titleWrap.className = 'title-wrap';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.contentEditable = 'true';
  title.textContent = assignment.title;
  title.addEventListener('blur', async () => {
    assignment.title = title.textContent.trim();
    await save();
  });
  title.addEventListener('mousedown', (e) => e.stopPropagation());
  titleWrap.appendChild(title);

  const badge = document.createElement('span');
  badge.className = 'ongoing-badge';
  badge.textContent = 'ONGOING';
  badge.style.display = assignment.ongoing ? 'inline-block' : 'none';
  titleWrap.appendChild(badge);

  const cardColorWrap = document.createElement('div');
  cardColorWrap.className = 'color-wrap';
  const cardColorBtn = document.createElement('button');
  cardColorBtn.className = 'swatch-btn card-color-btn';
  cardColorBtn.style.background = assignment.cardColor;
  cardColorBtn.title = 'Change card color';
  cardColorBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  const cardColorPop = document.createElement('div');
  cardColorPop.className = 'swatch-pop';
  PALETTE.forEach(c => {
    const opt = document.createElement('button');
    opt.className = 'swatch-opt';
    opt.style.background = c;
    opt.addEventListener('mousedown', (e) => e.stopPropagation());
    opt.addEventListener('click', async (e) => {
      e.stopPropagation();
      assignment.cardColor = c;
      card.style.background = c;
      cardColorBtn.style.background = c;
      cardColorPop.classList.remove('open');
      await save();
    });
    cardColorPop.appendChild(opt);
  });
  cardColorBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = cardColorPop.classList.contains('open');
    if(!wasOpen) openPopover(cardColorBtn, cardColorPop); else closeAllSwatchPops();
  });
  cardColorWrap.appendChild(cardColorBtn);
  cardColorWrap.appendChild(cardColorPop);

  const ongoingToggle = document.createElement('button');
  ongoingToggle.className = 'ongoing-toggle' + (assignment.ongoing ? ' active' : '');
  ongoingToggle.innerHTML = '&#8635;';
  ongoingToggle.title = assignment.ongoing ? 'Ongoing task — click to make one-time' : 'One-time task — click to mark as ongoing';
  ongoingToggle.addEventListener('mousedown', (e) => e.stopPropagation());
  ongoingToggle.addEventListener('click', async () => {
    assignment.ongoing = !assignment.ongoing;
    await save();
    render();
  });

  const del = document.createElement('button');
  del.className = 'del-btn';
  del.textContent = '×';
  let confirming = false;
  del.addEventListener('mousedown', (e) => e.stopPropagation());
  del.addEventListener('click', async () => {
    if(!confirming){
      confirming = true;
      del.classList.add('confirm');
      del.textContent = 'delete?';
      setTimeout(() => {
        confirming = false;
        del.classList.remove('confirm');
        del.textContent = '×';
      }, 3000);
      return;
    }
    state.assignments = state.assignments.filter(a => a.id !== assignment.id);
    await save();
    render();
  });

  head.appendChild(titleWrap);
  head.appendChild(cardColorWrap);
  head.appendChild(ongoingToggle);
  head.appendChild(del);
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'card-body';

  const colLeft = document.createElement('div');
  colLeft.className = 'col-left';
  colLeft.appendChild(fieldBlock(assignment, fieldDef('doneLooksLike')));
  colLeft.appendChild(fieldBlock(assignment, fieldDef('notes')));
  colLeft.appendChild(fieldBlock(assignment, fieldDef('checkIn')));

  const colRight = document.createElement('div');
  colRight.className = 'col-right';
  colRight.appendChild(fieldBlock(assignment, fieldDef('dueDate')));
  colRight.appendChild(fieldBlock(assignment, fieldDef('blockedOn')));

  body.appendChild(colLeft);
  body.appendChild(colRight);
  card.appendChild(body);

  const foot = document.createElement('div');
  foot.className = 'card-foot';

  const lastLoggedText = document.createElement('span');
  lastLoggedText.className = 'last-logged';
  if(assignment.ongoing && assignment.lastLogged){
    lastLoggedText.textContent = 'Last logged: ' + fmtDate(assignment.lastLogged);
  }
  foot.appendChild(lastLoggedText);

  const completeBtn = document.createElement('button');
  completeBtn.className = 'complete-btn';
  completeBtn.innerHTML = assignment.ongoing ? '&#10003; Log check-in' : '&#10003; Mark complete';
  completeBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  completeBtn.addEventListener('click', () => {
    if(assignment.ongoing) logCheckIn(assignment.id, card);
    else completeAssignment(assignment.id, card);
  });
  foot.appendChild(completeBtn);
  card.appendChild(foot);

  return card;
}

async function completeAssignment(id, card){
  const mark = card.querySelector('.stamp-mark');
  mark.textContent = 'DONE';
  mark.style.color = 'var(--good)';
  mark.style.borderColor = 'var(--good)';
  card.classList.add('stamping');
  setTimeout(() => {
    card.classList.add('flying');
  }, 480);
  setTimeout(async () => {
    const idx = state.assignments.findIndex(a => a.id === id);
    if(idx === -1) return;
    const [done] = state.assignments.splice(idx, 1);
    done.completedAt = Date.now();
    state.archive.unshift(done);
    state.starTotal = (state.starTotal || 0) + 1;
    await save();
    render();
    bumpStarTally();
  }, 950);
}

async function logCheckIn(id, card){
  const mark = card.querySelector('.stamp-mark');
  mark.textContent = 'LOGGED';
  mark.style.color = 'var(--accent-dark)';
  mark.style.borderColor = 'var(--accent-dark)';
  card.classList.add('stamping');
  setTimeout(async () => {
    const a = state.assignments.find(x => x.id === id);
    if(a){
      a.lastLogged = Date.now();
      await save();
      render();
    }
  }, 700);
}

async function restoreAssignment(id){
  const idx = state.archive.findIndex(a => a.id === id);
  if(idx === -1) return;
  const [item] = state.archive.splice(idx, 1);
  delete item.completedAt;
  state.assignments.push(item);
  await save();
  render();
  renderArchive();
}

async function deleteArchived(id){
  state.archive = state.archive.filter(a => a.id !== id);
  await save();
  renderArchive();
}

let sortableInstance = null;

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';

  if(state.assignments.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<h3>Nothing on the board</h3><p>Add an assignment to get started.</p>';
    board.appendChild(empty);
  } else {
    state.assignments.forEach(a => board.appendChild(cardEl(a)));
  }

  const addTile = document.createElement('button');
  addTile.className = 'add-tile';
  addTile.textContent = '+ Add assignment';
  addTile.addEventListener('click', addAssignment);
  board.appendChild(addTile);

  const badge = document.getElementById('archiveCount');
  if(state.archive.length > 0){
    badge.style.display = 'inline-flex';
    badge.textContent = state.archive.length;
  } else {
    badge.style.display = 'none';
  }

  if(sortableInstance) sortableInstance.destroy();
  sortableInstance = new Sortable(board, {
    animation: 180,
    filter: '.add-tile, .empty-state',
    onFilter: function(evt){ /* prevent drag on add tile */ },
    onEnd: async function(){
      const ids = [...board.querySelectorAll('.card')].map(c => c.dataset.id);
      const map = new Map(state.assignments.map(a => [a.id, a]));
      state.assignments = ids.map(id => map.get(id)).filter(Boolean);
      await save();
    }
  });

  renderStarTally();
  renderEvents();
}

function renderStarTally(){
  document.getElementById('starCount').textContent = state.starTotal || 0;
}

function bumpStarTally(){
  const tally = document.getElementById('starTally');
  tally.classList.remove('bump');
  void tally.offsetWidth; // restart animation
  tally.classList.add('bump');
}

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

function renderArchive(){
  const list = document.getElementById('archiveList');
  list.innerHTML = '';
  if(state.archive.length === 0){
    list.innerHTML = '<div class="archive-empty">No completed assignments yet.</div>';
    return;
  }
  state.archive.forEach(a => {
    const item = document.createElement('div');
    item.className = 'archive-item';
    const left = document.createElement('div');
    left.innerHTML = `<div class="archive-item-title">${escapeHtml(a.title || 'Untitled assignment')}</div><div class="archive-item-date">Completed ${fmtDate(a.completedAt)}</div>`;
    const actions = document.createElement('div');
    actions.className = 'archive-actions';
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'mini-btn';
    restoreBtn.textContent = 'Restore';
    restoreBtn.addEventListener('click', () => restoreAssignment(a.id));
    const delBtn = document.createElement('button');
    delBtn.className = 'mini-btn danger';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => deleteArchived(a.id));
    actions.appendChild(restoreBtn);
    actions.appendChild(delBtn);
    item.appendChild(left);
    item.appendChild(actions);
    list.appendChild(item);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function addAssignment(){
  const a = { id: uid(), title:'', ongoing:false, cardColor:'#fffdf8', fields: blankFields() };
  state.assignments.push(a);
  await save();
  render();
  const board = document.getElementById('board');
  const newCard = [...board.querySelectorAll('.card')].find(c => c.dataset.id === a.id);
  if(newCard){
    const t = newCard.querySelector('.card-title');
    t.focus();
  }
}

function renderEvents(){
  const body = document.getElementById('eventsBody');
  body.innerHTML = '';

  if(state.events.length === 0){
    const row = document.createElement('tr');
    row.className = 'events-empty';
    row.innerHTML = '<td colspan="5">No upcoming events yet — add one below.</td>';
    body.appendChild(row);
    return;
  }

  state.events.forEach(ev => {
    const row = document.createElement('tr');
    row.dataset.id = ev.id;
    row.style.background = ev.color || 'transparent';

    const dateTd = document.createElement('td');
    dateTd.className = 'date-cell';
    dateTd.contentEditable = 'true';
    dateTd.textContent = ev.date || '';
    dateTd.addEventListener('blur', async () => { ev.date = dateTd.textContent.trim(); await save(); });

    const eventTd = document.createElement('td');
    eventTd.contentEditable = 'true';
    eventTd.textContent = ev.event || '';
    eventTd.addEventListener('blur', async () => { ev.event = eventTd.textContent.trim(); await save(); });

    const locTd = document.createElement('td');
    locTd.contentEditable = 'true';
    locTd.textContent = ev.location || '';
    locTd.addEventListener('blur', async () => { ev.location = locTd.textContent.trim(); await save(); });

    const notesTd = document.createElement('td');
    notesTd.contentEditable = 'true';
    notesTd.textContent = ev.notes || '';
    notesTd.addEventListener('blur', async () => { ev.notes = notesTd.textContent.trim(); await save(); });

    const delTd = document.createElement('td');
    delTd.className = 'event-del-cell';

    const colorWrap = document.createElement('div');
    colorWrap.className = 'color-wrap';
    const swatchBtn = document.createElement('button');
    swatchBtn.className = 'swatch-btn';
    swatchBtn.style.background = ev.color || '#ffffff';
    swatchBtn.title = 'Row color';
    const pop = document.createElement('div');
    pop.className = 'swatch-pop';
    PALETTE.forEach(c => {
      const opt = document.createElement('button');
      opt.className = 'swatch-opt';
      opt.style.background = c;
      opt.addEventListener('click', async (e) => {
        e.stopPropagation();
        ev.color = c;
        row.style.background = c;
        swatchBtn.style.background = c;
        pop.classList.remove('open');
        await save();
      });
      pop.appendChild(opt);
    });
    swatchBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = pop.classList.contains('open');
      if(!wasOpen) openPopover(swatchBtn, pop); else closeAllSwatchPops();
    });
    colorWrap.appendChild(swatchBtn);
    colorWrap.appendChild(pop);

    const delBtn = document.createElement('button');
    delBtn.className = 'event-del-btn';
    delBtn.textContent = '×';
    delBtn.title = 'Delete row';
    delBtn.addEventListener('click', () => deleteEventRow(ev.id));
    delTd.appendChild(colorWrap);
    delTd.appendChild(delBtn);

    row.appendChild(dateTd);
    row.appendChild(eventTd);
    row.appendChild(locTd);
    row.appendChild(notesTd);
    row.appendChild(delTd);
    body.appendChild(row);
  });
}

async function addEventRow(){
  const ev = { id: uid(), date:'', event:'', location:'', notes:'', color:'#ffffff' };
  state.events.push(ev);
  await save();
  renderEvents();
  const body = document.getElementById('eventsBody');
  const newRow = body.querySelector(`tr[data-id="${ev.id}"]`);
  if(newRow) newRow.querySelector('.date-cell').focus();
}

async function deleteEventRow(id){
  state.events = state.events.filter(e => e.id !== id);
  await save();
  renderEvents();
}

document.getElementById('addEventBtn').addEventListener('click', addEventRow);

document.getElementById('addBtn').addEventListener('click', addAssignment);

document.getElementById('archiveBtn').addEventListener('click', () => {
  renderArchive();
  document.getElementById('archiveOverlay').classList.add('open');
});
document.getElementById('archiveCloseBtn').addEventListener('click', () => {
  document.getElementById('archiveOverlay').classList.remove('open');
});
document.getElementById('archiveOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'archiveOverlay') e.target.classList.remove('open');
});
document.addEventListener('click', closeAllSwatchPops);

function scheduleStarWiggle(){
  const minMs = 20 * 1000;
  const maxMs = 4 * 60 * 1000;
  const delay = minMs + Math.random() * (maxMs - minMs);
  setTimeout(() => {
    const icon = document.querySelector('.star-tally .star-icon');
    if(icon){
      icon.classList.remove('wiggle');
      void window.getComputedStyle(icon).opacity; // force reflow to restart animation
      icon.classList.add('wiggle');
    }
    scheduleStarWiggle();
  }, delay);
}

load();
scheduleStarWiggle();
</script>
</body>
</html>
